<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/svg" href="/media/smiley.svg">
        <!-- UIkit CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.13.5/dist/css/uikit.min.css" />

        <!-- UIkit JS -->
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.13.5/dist/js/uikit.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.13.5/dist/js/uikit-icons.min.js"></script>
        <title>Schmoundcloud</title>
    </head>
    <body>

        <div id="navbar-placeholder"></div>
    
        <script>
            fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });
        </script>

        <div class="uk-container">
            <div class="uk-card uk-card-default">
                <div class="uk-card-body uk-text-justify">
                    <h3 class="uk-card-title">Soundcloud sucks...</h3>
                    <ul>
                    <li>ads</li>
                    <li>limited upload time</li>
                    <li>copyright bots going crazy</li>
                    <li>ads</li>
                    </ul>
                    <p>=&gt; it's time to self-host tracks!</p>
                    <h3 class="uk-card-title">Introducing:</h3>
                    <p>
                        <img src="/media/schmoundcloud.png"/> <strong>Schmoundcloud</strong>
                    </p>
                    <p>a light-weight audio player, inspired by Soundcloud, keeping only the useful and appreciated features</p>
                </div>
                    <div class="uk-card-footer">
                        <a href="https://schmoundcloud.yoav.ch" class="uk-button uk-button-text">go to schmoundcloud</a>
                    </div> 
            </div>
        </div>

    </body>
</html>
